<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Vue 3 Standalone</title>
  <!-- Carregando Vue.js local baixado -->
  <script src="./vue.global.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-vue: #42b883;
      --accent-vue-dark: #35495e;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    #app {
      width: 100%;
      max-width: 540px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .vue-logo {
      width: 48px;
      height: 48px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #42b883 0%, #35495e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .counter-display {
      font-size: 3rem;
      font-weight: 700;
      text-align: center;
      color: var(--accent-vue);
      margin: 1rem 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    button.primary {
      background-color: var(--accent-vue);
      color: #0f172a;
    }

    button.primary:hover {
      background-color: #33a06f;
      transform: translateY(-2px);
    }

    button.secondary {
      background-color: var(--border-color);
      color: var(--text-color);
    }

    button.secondary:hover {
      background-color: #475569;
      transform: translateY(-2px);
    }

    .info-list {
      list-style: none;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .info-list li {
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-list li::before {
      content: "✓";
      color: var(--accent-vue);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="header">
      <svg class="vue-logo" viewBox="0 0 128 128">
        <path fill="#42b883" d="M78.8,10L64,35.4L49.2,10H0l64,110l64-110H78.8z"/>
        <path fill="#35495e" d="M78.8,10L64,35.4L49.2,10H25.6L64,76.8l38.4-66.8H78.8z"/>
      </svg>
      <div>
        <h1>{{ title }}</h1>
        <p style="color: #94a3b8; font-size: 0.9rem;">Vue.js {{ version }} Standalone</p>
      </div>
    </div>

    <div class="card">
      <p style="text-align: center; color: #94a3b8;">Contador Reativo:</p>
      <div class="counter-display">{{ count }}</div>
      <div class="btn-group">
        <button class="secondary" @click="decrement">- Diminuir</button>
        <button class="primary" @click="increment">+ Aumentar</button>
      </div>
    </div>

    <div class="card">
      <ul class="info-list">
        <li>Arquivo <code>vue.global.js</code> baixado localmente</li>
        <li>Sem dependência de gerenciador de pacotes</li>
        <li>Pronto para inclusão em qualquer página HTML</li>
      </ul>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        const title = ref('Vue.js 3 Funcional!');
        const version = ref(Vue.version);
        const count = ref(0);

        const increment = () => count.value++;
        const decrement = () => count.value--;

        return {
          title,
          version,
          count,
          increment,
          decrement
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
